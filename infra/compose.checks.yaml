# Check market (docs/CHECK-MARKET.md): three RGB Lightning nodes with HODL
# invoices on the SAME isolated bitcoind/electrs/proxy network as compose.yaml.
# The image is the UTEXO fork's HODL commit (infra/check-market.sh build), used
# for the check market only; the loan demo keeps the pinned passbook-rln:d4762ac.
#   borrower (payer) 3181, check node A 3182, check node B 3183
services:
  check-rln-borrower:
    image: ${PASSBOOK_CHECK_RLN_IMAGE:-passbook-rln:hodl-61be1f7}
    command: ["/RLNdata", "--daemon-listening-port", "3001", "--ldk-peer-listening-port", "9735", "--network", "regtest", "--disable-authentication"]
    ports: ["127.0.0.1:${PASSBOOK_CHECK_RLN_BORROWER_PORT:-3181}:3001"]
    volumes: [check-rln-borrower:/RLNdata]
    networks: [chain]
  check-rln-a:
    image: ${PASSBOOK_CHECK_RLN_IMAGE:-passbook-rln:hodl-61be1f7}
    command: ["/RLNdata", "--daemon-listening-port", "3001", "--ldk-peer-listening-port", "9735", "--network", "regtest", "--disable-authentication"]
    ports: ["127.0.0.1:${PASSBOOK_CHECK_RLN_A_PORT:-3182}:3001"]
    volumes: [check-rln-a:/RLNdata]
    networks: [chain]
  check-rln-b:
    image: ${PASSBOOK_CHECK_RLN_IMAGE:-passbook-rln:hodl-61be1f7}
    command: ["/RLNdata", "--daemon-listening-port", "3001", "--ldk-peer-listening-port", "9735", "--network", "regtest", "--disable-authentication"]
    ports: ["127.0.0.1:${PASSBOOK_CHECK_RLN_B_PORT:-3183}:3001"]
    volumes: [check-rln-b:/RLNdata]
    networks: [chain]
volumes:
  check-rln-borrower:
  check-rln-a:
  check-rln-b:
