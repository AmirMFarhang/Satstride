[package]
name = "passbook-rgb-g1-spike"
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
publish = false

# Independent capability probe. No unpublished Passbook G0 contract is imported.
[dependencies]
rgb-lib = { git = "https://github.com/kaleidoswap/rgb-lib", rev = "5f655a9cd02d23996d4d79e6d5f4e6add0301197", default-features = false, features = ["electrum"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde_json = "1"

[profile.dev]
debug = 0
incremental = false

[profile.release]
overflow-checks = true
